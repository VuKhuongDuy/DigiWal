# Pulls in ../../infra/docker-compose.yml via `include:` — don't also pass it with -f.
include:
  - path: ../../infra/docker-compose.yml

services:
  sweeper:
    build:
      context: ../..            # repo root: the image needs pkg/events
      dockerfile: services/sweeper/Dockerfile
    environment:
      PORT: "8080"
      KAFKA_BROKERS: kafka:9092
      RPC_URL: ${RPC_URL:-http://anvil:8545}
      ASSETS_FILE: /config/assets.yaml
      SCREENING_FILE: /config/screening.yaml
      # wallet-service, over mTLS as CN=sweeper: signing, and the Hot Wallet address (asked once at startup).
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-https://wallet-service:8443}
      # ledger-service, over mTLS as CN=sweeper: only POST /v1/ledger/gas-fees (best effort, ledger.md invariant #12).
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-https://ledger-service:8443}
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
    volumes:
      - ../../infra/assets.yaml:/config/assets.yaml:ro
      - ../../infra/screening.yaml:/config/screening.yaml:ro
      - ../../infra/pki/out/sweeper:/certs:ro
    ports: ["8085:8080"]
    depends_on:
      kafka:
        condition: service_healthy
      anvil:
        condition: service_healthy
