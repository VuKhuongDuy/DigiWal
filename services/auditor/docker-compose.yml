# Dev environment only (docs/design/reconciliation-audit.md, Scope). Pulls in ../../infra/docker-compose.yml
# via `include:` — don't also pass it with -f.
include:
  - path: ../../infra/docker-compose.yml

services:
  auditor:
    build:
      context: ../..            # repo root
      dockerfile: services/auditor/Dockerfile
    environment:
      PORT: "8080"
      AUDITOR_ENV: dev
      AUDITOR_ALLOWED_CHAIN_IDS: ${AUDITOR_ALLOWED_CHAIN_IDS:-31337}
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/auditor?sslmode=disable
      RPC_URL: ${RPC_URL:-http://anvil:8545}
      # Read-only logins (roles/, `make roles`); each audit is skipped unless the logins it needs are set.
      LEDGER_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/ledger?sslmode=disable
      WALLET_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/custody?sslmode=disable
      WITHDRAWAL_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/withdrawal?sslmode=disable
      WATCHER_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/chain_watcher?sslmode=disable
      AUDIT_SCAN_START_BLOCK: ${AUDIT_SCAN_START_BLOCK:-0}
      # Tier addresses (public). Warm is Anvil's default account #9, as in infra/treasury.yaml. Hot is derived by
      # wallet-service from its seed: set it from `GET /v1/wallet/hot-address` (see README). Cold is optional.
      AUDIT_HOT_ADDRESS: ${AUDIT_HOT_ADDRESS:-}
      AUDIT_WARM_ADDRESS: ${AUDIT_WARM_ADDRESS:-0xa0Ee7A142d267C1f36714E4a8F75612F20a79720}
      AUDIT_COLD_ADDRESS: ${AUDIT_COLD_ADDRESS:-}
      # Reconciliation: operator capital in custody that no user owns (the Hot Wallet's gas float and liquidity),
      # e.g. RECON_CAPITAL=ETH=10000000000000000000. RECON_TOLERANCE overrides 0.01 ETH / 0 for tokens.
      RECON_CAPITAL: ${RECON_CAPITAL:-}
      RECON_TOLERANCE: ${RECON_TOLERANCE:-}
      HISTORY_RO_MONGO_URI: mongodb://auditor_ro:auditor_ro@mongo:27017/?authSource=history
    ports: ["8087:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
