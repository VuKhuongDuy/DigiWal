include:
  - path: ../../infra/docker-compose.yml

services:
  wallet-service:
    build: .
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/custody?sslmode=disable
      REDIS_ADDR: redis:6379
      # Set in .env (gitignored) — `make gen-key` creates one.
      MASTER_KEY_HEX: ${MASTER_KEY_HEX:?run 'make gen-key' first, see README}
      # mTLS listener for /v1/sign/* — certs from `make certs` (infra/pki).
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
      # Hot Wallet signing builds the tx itself, so it needs an EVM RPC and the asset
      # list (see assets.example.json). Unset = /v1/sign/hot-wallet answers 503.
      RPC_URL: ${RPC_URL:-}
      ASSETS_FILE: ${ASSETS_FILE:+/config/assets.json}
    volumes:
      - ../../infra/pki/out/wallet-service:/certs:ro
      - ${ASSETS_FILE:-/dev/null}:/config/assets.json:ro
    ports: ["8080:8080", "8443:8443"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
