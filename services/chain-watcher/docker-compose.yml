# Pulls in ../../infra/docker-compose.yml via `include:` — don't also pass it with -f.
include:
  - path: ../../infra/docker-compose.yml

services:
  chain-watcher:
    build:
      context: ../..            # repo root: the image needs pkg/events
      dockerfile: services/chain-watcher/Dockerfile
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/chain_watcher?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      # Anvil by default; point at Sepolia (and unset CONFIRMATION_DEPTH's override) for staging.
      RPC_URL: ${RPC_URL:-http://anvil:8545}
      # Sepolia's decided depth is 32 blocks (deposit-flow.md); a local chain needs far fewer.
      CONFIRMATION_DEPTH: ${CONFIRMATION_DEPTH:-2}
      POLL_INTERVAL: ${POLL_INTERVAL:-2s}
      START_BLOCK: ${START_BLOCK:-}
      ASSETS_FILE: /config/assets.yaml
      # Address Resolution's fallback: wallet-service over mTLS, as CN=chain-watcher.
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-https://wallet-service:8443}
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
    volumes:
      - ../../infra/assets.yaml:/config/assets.yaml:ro
      - ../../infra/pki/out/chain-watcher:/certs:ro
    ports: ["8082:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      anvil:
        condition: service_healthy
