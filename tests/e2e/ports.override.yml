# QA chaos stack: Dev's e2e/docker-compose.yml with every host port shifted +10000, so it runs next to digiwal-dev.
services:
  postgres: {ports: !override ["15432:5432"]}
  redis: {ports: !override ["16379:6379"]}
  kafka: {ports: !override []}
  mongo: {ports: !override ["17017:27017"]}
  anvil: {ports: !override ["18545:8545"]}
  prometheus: {ports: !override []}
  grafana: {ports: !override []}
  wallet-service: {ports: !override ["18080:8080", "18443:8443"]}
  ledger-service: {ports: !override ["18081:8080", "18444:8443"]}
  chain-watcher: {ports: !override ["18082:8080"]}
  history-service: {ports: !override ["18083:8080"]}
  api-gateway: {ports: !override ["18084:8080"]}
  sweeper: {ports: !override ["18085:8080"]}
  withdrawal-service: {ports: !override ["18086:8080", "18446:8443"]}
