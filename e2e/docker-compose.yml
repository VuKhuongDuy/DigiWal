# The whole M2 stack in ONE compose project, layered over the shared infra:
#   docker compose -p digiwal-e2e -f ../infra/docker-compose.yml -f docker-compose.yml up
# (each services/*/docker-compose.yml is its own project, so they cannot reach each other).
# Env values mirror those files; `make e2e` (see Makefile) drives all of this.
services:
  postgres:
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  wallet-service:
    build: ../services/wallet-service
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/custody?sslmode=disable
      REDIS_ADDR: redis:6379
      MASTER_KEY_HEX: ${MASTER_KEY_HEX:?set by 'make e2e'}
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
      RPC_URL: http://anvil:8545
      ASSETS_FILE: /config/assets.yaml
      TREASURY_FILE: /config/treasury.yaml   # wallet-service only, never mounted elsewhere
    volumes:
      - ../infra/pki/out/wallet-service:/certs:ro
      - ./assets.yaml:/config/assets.yaml:ro
      - ../infra/treasury.yaml:/config/treasury.yaml:ro
    ports: ["8080:8080", "8443:8443"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      anvil: {condition: service_healthy}

  ledger-service:
    build:
      context: ..
      dockerfile: services/ledger-service/Dockerfile
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/ledger?sslmode=disable
      ASSETS_FILE: /config/assets.yaml
      SCREENING_FILE: /config/screening.yaml
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./assets.yaml:/config/assets.yaml:ro
      - ../infra/screening.yaml:/config/screening.yaml:ro
      - ../infra/pki/out/ledger-service:/certs:ro
    ports: ["8081:8080", "8444:8443"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  chain-watcher:
    build:
      context: ..
      dockerfile: services/chain-watcher/Dockerfile
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/chain_watcher?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      RPC_URL: http://anvil:8545
      CONFIRMATION_DEPTH: "2"
      POLL_INTERVAL: 1s
      ASSETS_FILE: /config/assets.yaml
      WALLET_SERVICE_URL: https://wallet-service:8443
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
    volumes:
      - ./assets.yaml:/config/assets.yaml:ro
      - ../infra/pki/out/chain-watcher:/certs:ro
    ports: ["8082:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      anvil: {condition: service_healthy}

  sweeper:
    build:
      context: ..
      dockerfile: services/sweeper/Dockerfile
    environment:
      PORT: "8080"
      KAFKA_BROKERS: kafka:9092
      RPC_URL: http://anvil:8545
      ASSETS_FILE: /config/assets.yaml
      SCREENING_FILE: /config/screening.yaml
      WALLET_SERVICE_URL: https://wallet-service:8443
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
    volumes:
      - ./assets.yaml:/config/assets.yaml:ro
      - ../infra/screening.yaml:/config/screening.yaml:ro
      - ../infra/pki/out/sweeper:/certs:ro
    ports: ["8085:8080"]
    depends_on:
      kafka: {condition: service_healthy}
      anvil: {condition: service_healthy}

  history-service:
    build:
      context: ..
      dockerfile: services/history-service/Dockerfile
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://custody:custody@mongo:27017/?authSource=admin
      KAFKA_BROKERS: kafka:9092
    ports: ["8083:8080"]
    depends_on:
      mongo: {condition: service_started}
      kafka: {condition: service_healthy}

  api-gateway:
    build:
      context: ../services/api-gateway
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/api_gateway?sslmode=disable
      WALLET_SERVICE_URL: http://wallet-service:8080
      LEDGER_SERVICE_URL: https://ledger-service:8443
      WITHDRAWAL_SERVICE_URL: https://withdrawal-service:8443
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
    volumes:
      - ../infra/pki/out/api-gateway:/certs:ro
    ports: ["8084:8080"]
    depends_on:
      postgres: {condition: service_healthy}

  withdrawal-service:
    build:
      context: ..
      dockerfile: services/withdrawal-service/Dockerfile
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/withdrawal?sslmode=disable
      ASSETS_FILE: /config/assets.yaml
      SCREENING_FILE: /config/screening.yaml
      WALLET_SERVICE_URL: https://wallet-service:8443
      LEDGER_SERVICE_URL: https://ledger-service:8443
      RPC_URL: http://anvil:8545
      KAFKA_BROKERS: kafka:9092
      WITHDRAWAL_CONFIRMATION_DEPTH: "2"   # 64 on Sepolia (decided)
      POLL_INTERVAL: 1s
      # The Reaper's decided timeouts are 5 minutes; the nonce-gap test cannot wait that long.
      STUCK_REQUEST_TIMEOUT: 20s
      STUCK_RESERVATION_TIMEOUT: 20s
      REAPER_INTERVAL: 2s
      # 24h is the decided Whitelist Cooldown; the tests cannot wait that long.
      WHITELIST_COOLDOWN: ${WHITELIST_COOLDOWN:-2s}
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
    volumes:
      - ./assets.yaml:/config/assets.yaml:ro
      - ../infra/screening.yaml:/config/screening.yaml:ro
      - ../infra/pki/out/withdrawal-service:/certs:ro
    ports: ["8086:8080", "8446:8443"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      anvil: {condition: service_healthy}
      ledger-service: {condition: service_started}
      wallet-service: {condition: service_started}  # it retries system-addresses until wallet-service answers
