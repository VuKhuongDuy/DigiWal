# The dev auditor (services/auditor) inside the e2e project, for the Hot cutover rehearsal only (`make e2e-cutover`).
# Inert unless the `audit` profile is on. It reads every store as the read-only auditor_ro login (`make cutover-auditor-roles`
# creates it and the `auditor` database) and learns the tier addresses from wallet-service ONCE at start, so it must be
# restarted after the Hot address changes (the runbook does). Short intervals: the rehearsal cannot wait 5 minutes.
services:
  auditor:
    profiles: [audit]
    build:
      context: ..
      dockerfile: services/auditor/Dockerfile
    user: "10015:10015" # fixed uid = the owner of its leaf key (infra/pki/leaf-uid.sh)
    restart: "no"
    environment:
      PORT: "8080"
      AUDITOR_ENV: dev
      AUDITOR_ALLOWED_CHAIN_IDS: "31337"
      POSTGRES_DSN: postgres://custody:custody@postgres:5432/auditor?sslmode=disable
      RPC_URL: http://anvil:8545
      LEDGER_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/ledger?sslmode=disable
      WALLET_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/custody?sslmode=disable
      WITHDRAWAL_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/withdrawal?sslmode=disable
      WATCHER_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/chain_watcher?sslmode=disable
      HISTORY_RO_MONGO_URI: mongodb://auditor_ro:auditor_ro@mongo:27017/?authSource=history
      AUDIT_WALLET_URL: https://wallet-service:8443
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
      AUDIT_INTERVAL: ${AUDIT_INTERVAL:-4s}
      AUDIT_GRACE: ${AUDIT_GRACE:-4s}
      AUDIT_ESCALATE: ${AUDIT_ESCALATE:-60s}
      RECON_CAPITAL: ${RECON_CAPITAL:-}
      RECON_TOLERANCE: ${RECON_TOLERANCE:-}
    volumes:
      - ../infra/pki/out/auditor:/certs:ro
    ports: ["8087:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      anvil: {condition: service_healthy}
