# Node overlay for vm3 (10.10.0.2): custody and chain. See vm2.yml for how the two overlays fit together.
#   here:      postgres (custody, withdrawal, chain_watcher, auditor), kafka, redis, anvil, wallet-service,
#              chain-watcher, sweeper, sweep-signer, simulator, auditor, and the Measurement Plane: Prometheus,
#              Alertmanager (to Telegram), Grafana, kafka-exporter, and node/cAdvisor/postgres exporters
#   on vm2:    mongo, the Postgres of the request path (ledger), and hsm-gateway (the HSM token)
#   on vm4:    ledger-service, history-service, withdrawal-service
#   api-gateway and postgres-gateway (the api_gateway database) are here too (moved from vm4 on 2026-10-26)
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"

services:
  mongo: {profiles: [elsewhere]}
  ledger-service: {profiles: [elsewhere]}
  withdrawal-service: {profiles: [elsewhere]}
  history-service: {profiles: [elsewhere]}
  hsm-gateway: {profiles: [elsewhere]}
  hsm-perms: {profiles: [elsewhere]}

  postgres:
    command: [postgres, -c, hba_file=/etc/postgresql/pg_hba.conf, -c, shared_preload_libraries=pg_stat_statements,
      -c, track_io_timing=on, -c, track_wal_io_timing=on, -c, log_lock_waits=on]
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?run make env}
      POSTGRES_DB: postgres
      PG_DB_ROLES: "custody=svc_wallet withdrawal=svc_withdrawal chain_watcher=svc_chainwatcher auditor=svc_auditor"
      PW_svc_wallet: ${SVC_WALLET_PASSWORD:?run make env}
      PW_svc_withdrawal: ${SVC_WITHDRAWAL_PASSWORD:?run make env}
      PW_svc_chainwatcher: ${SVC_CHAINWATCHER_PASSWORD:?run make env}
      PW_svc_auditor: ${SVC_AUDITOR_PASSWORD:?run make env}
    volumes: !override
      - pg_core_data:/var/lib/postgresql/data
      - ../infra/postgres/init-node.sh:/docker-entrypoint-initdb.d/10-init-node.sh:ro
      - ../infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports: !override ["10.10.0.2:5432:5432", "127.0.0.1:5432:5432"]
    mem_limit: 1500m

  redis:
    # A disposable address cache (and rate-limit counters). Password-protected: 256 random bits from `make env`.
    # Read from the environment inside the container so it is not part of the rendered compose command;
    # REDISCLI_AUTH lets the image's `redis-cli ping` healthcheck authenticate.
    command: [sh, -c, 'exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: !override ["10.10.0.2:6379:6379"] # api-gateway shares its rate-limit counters here; WireGuard-only, password required
    mem_limit: 300m

  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m # the volume is tiny; the default heap is sized to the host
    ports: !override ["10.10.0.2:9092:9092"] # advertised as kafka:9092; vm2's services resolve kafka via extra_hosts
    mem_limit: 1g

  anvil:
    ports: !override ["10.10.0.2:8545:8545", "127.0.0.1:8545:8545"]

  wallet-service:
    environment:
      POSTGRES_DSN: postgres://svc_wallet:${SVC_WALLET_PASSWORD}@postgres:5432/custody?sslmode=disable
      POSTGRES_MAX_CONNS: "16" # pgx's default is 4 on a 4-vCPU host: withdrawal-service queued every request on it
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env}
      # pkcs11 (the only backend of this stack): the Hot Wallet is signed by hsm-gateway on vm2 over WireGuard,
      # pinned to wallet-service's leaf (CN wallet-service, the same /certs); the hot_wallet seed is not loaded.
      SIGNER_BACKEND: ${SIGNER_BACKEND:-pkcs11}
      HSM_GATEWAY_URL: https://hsm-gateway:8445
    extra_hosts: ["hsm-gateway:10.10.0.1"]
    ports: !override ["10.10.0.2:8443:8443", "10.10.0.2:8080:8080"] # gateway (plain HTTP: a documented gap, now private), peers
    mem_limit: 300m
    memswap_limit: 300m

  # The Hot cutover job (docs/runbooks/hot-cutover.md) runs here: it needs custody's database and wallet-service's leaf.
  hot-cutover:
    environment:
      POSTGRES_DSN: postgres://svc_wallet:${SVC_WALLET_PASSWORD}@postgres:5432/custody?sslmode=disable
      HSM_GATEWAY_URL: https://hsm-gateway:8445
      LEDGER_SERVICE_URL: https://ledger-service:8444
    extra_hosts: ["hsm-gateway:10.10.0.1", "ledger-service:10.10.0.3"]

  # key-admin (docs/runbooks/dev-hsm-bringup.md): custody's database and the gateway over WireGuard, as its own pinned leaf (CN key-admin).
  key-admin:
    environment:
      POSTGRES_DSN: postgres://svc_wallet:${SVC_WALLET_PASSWORD}@postgres:5432/custody?sslmode=disable
      HSM_GATEWAY_URL: https://hsm-gateway:8445
    extra_hosts: ["hsm-gateway:10.10.0.1"]

  chain-watcher:
    environment:
      POSTGRES_DSN: postgres://svc_chainwatcher:${SVC_CHAINWATCHER_PASSWORD}@postgres:5432/chain_watcher?sslmode=disable
      POSTGRES_MAX_CONNS: "16" # pgx's default is 4 on a 4-vCPU host: withdrawal-service queued every request on it
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env}
    ports: !override []
    mem_limit: 200m

  sweeper:
    environment:
      LEDGER_SERVICE_URL: https://ledger-service:8444
    extra_hosts: ["ledger-service:10.10.0.3"]
    depends_on: !override
      kafka: {condition: service_healthy}
      anvil: {condition: service_healthy}
      sweep-signer: {condition: service_healthy}
    ports: !override []
    mem_limit: 200m

  # sweep-signer (key-custody-hsm.md M3b): the only holder of the user_derivation seed, next to custody's database. No published port: sweeper
  # reaches it on this node's compose network (mTLS, CN sweeper, pinned leaf). With SIGNER_BACKEND=pkcs11 it pins the Hot address from hsm-gateway
  # over WireGuard (as its own pinned leaf, CN sweep-signer), and gets the seed by POST /v1/vault/unseal on the same gateway. Hardening is in e2e/docker-compose.yml
  # and checked by `make verify`; its secrets are files from `make vault-files`.
  sweep-signer:
    environment:
      HSM_GATEWAY_URL: https://hsm-gateway:8445
    extra_hosts: ["hsm-gateway:10.10.0.1"]

  # The api_gateway database (users and API-key hashes), next to the only service that uses it. Scaling step 2 split it from the ledger's
  # Postgres; it moved from vm4 to vm3 on 2026-10-26 because a key lookup per request across WireGuard held a pool connection for ~30 ms.
  postgres-gateway:
    image: postgres:16-alpine
    command: [postgres, -c, hba_file=/etc/postgresql/pg_hba.conf, -c, shared_preload_libraries=pg_stat_statements,
      -c, track_io_timing=on, -c, track_wal_io_timing=on, -c, log_lock_waits=on]
    environment:
      POSTGRES_USER: custody
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?run make env}
      POSTGRES_DB: postgres
      PG_DB_ROLES: "api_gateway=svc_gateway"
      PW_svc_gateway: ${SVC_GATEWAY_PASSWORD:?run make env}
    volumes:
      - pg_gateway_data:/var/lib/postgresql/data
      - ../infra/postgres/init-node.sh:/docker-entrypoint-initdb.d/10-init-node.sh:ro
      - ../infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports: ["10.10.0.2:5433:5432", "127.0.0.1:5433:5432"] # 5432 is the core Postgres; the gateway reaches this one on the compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custody"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: 2 # the lab's cap on the database the gateway reads on every request
    mem_limit: 1g

  # api-gateway sits next to Redis (its rate-limit counters) and wallet-service (deposit addresses), apart from the ledger it calls
  # and from the load generator (vm2). Its database, postgres-gateway, is on this node too; ledger-service and withdrawal-service are reached
  # over mTLS on the ports vm4 publishes (8444, 8446).
  api-gateway:
    environment:
      POSTGRES_DSN: postgres://svc_gateway:${SVC_GATEWAY_PASSWORD}@postgres-gateway:5432/api_gateway?sslmode=disable
      POSTGRES_MAX_CONNS: "48" # its database is on vm4: at 16 the pool was the limit (avg wait 213 ms, 90% of acquires waited at 800 req/s)
      LEDGER_SERVICE_URL: https://ledger-service:8444
      WITHDRAWAL_SERVICE_URL: https://withdrawal-service:8446
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env}
    extra_hosts: ["ledger-service:10.10.0.3", "withdrawal-service:10.10.0.3"]
    depends_on: !override
      redis: {condition: service_healthy}
      postgres-gateway: {condition: service_healthy}
    ports: !override ["10.10.0.2:8084:8080", "127.0.0.1:8084:8080", "10.10.0.2:9101:9100"] # never on the public interface (invariant 8); /metrics
    mem_limit: 500m

  simulator:
    environment:
      SIM_GATEWAY_URL: http://api-gateway:8080 # api-gateway is on this node
    depends_on: !override
      anvil: {condition: service_healthy}
      wallet-service: {condition: service_started}
      sweeper: {condition: service_started}
      chain-watcher: {condition: service_started}
    mem_limit: 200m

  # ---- the auditor (dev only): reads the other services' stores as the read-only login auditor_ro (`make audit-roles`)
  auditor:
    environment:
      POSTGRES_DSN: postgres://svc_auditor:${SVC_AUDITOR_PASSWORD}@postgres:5432/auditor?sslmode=disable
      LEDGER_RO_DSN: postgres://auditor_ro:auditor_ro@10.10.0.1:5432/ledger?sslmode=disable # pg-ledger on vm2
      WALLET_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/custody?sslmode=disable
      WITHDRAWAL_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/withdrawal?sslmode=disable
      WATCHER_RO_DSN: postgres://auditor_ro:auditor_ro@postgres:5432/chain_watcher?sslmode=disable
      HISTORY_RO_MONGO_URI: mongodb://auditor_ro:auditor_ro@10.10.0.1:27017/?authSource=history # mongo on vm2
    ports: !override []
    depends_on: !override
      postgres: {condition: service_healthy}
      anvil: {condition: service_healthy}
      wallet-service: {condition: service_started}
    mem_limit: 200m

  # ---- Measurement Plane. Prometheus and Grafana are reached over ssh tunnels only (127.0.0.1).
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2y
      - --storage.tsdb.retention.size=25GB # the disk is 96 GB and shared with Anvil, Kafka and Postgres
    volumes: !override
      - ../infra/prometheus/prometheus.multi-node.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../infra/prometheus/alerts-node.yml:/etc/prometheus/alerts-node.yml:ro
      - prometheus_data:/prometheus
    ports: !override ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    mem_limit: 1g

  grafana:
    volumes: !override
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: !override ["127.0.0.1:3000:3000"] # anonymous Admin: never on a routable address
    restart: unless-stopped
    mem_limit: 400m

  alertmanager:
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 100m

  kafka-exporter:
    mem_limit: 100m

  node-exporter:
    command: [--path.rootfs=/host, "--web.listen-address=10.10.0.2:9100"]
    mem_limit: 100m
  cadvisor:
    ports: ["10.10.0.2:8081:8080"]
    mem_limit: 200m
  postgres-exporter:
    ports: ["10.10.0.2:9187:9187"]
    mem_limit: 100m

volumes:
  pg_core_data:
  prometheus_data:
  grafana_data:
  pg_gateway_data:
