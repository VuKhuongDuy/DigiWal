# The always-on dev environment (this VM): the e2e stack's services, made long-lived, plus a simulator
# that keeps users active. Layered over infra/ and e2e/ — see the Makefile for the exact command.
# Paths below are relative to e2e/ (the Makefile passes --project-directory ../e2e, as the e2e compose
# file's own relative paths need).
#
# Differences from the e2e stack (which is throwaway and deterministic):
#   * restart: unless-stopped everywhere, named volumes survive `make down` (only `make reset` drops them)
#   * anvil mines a block every 2s (the sweeper, chain-watcher and withdrawals only advance with blocks)
#     and persists its chain in a volume, so the token address, nonces and the databases stay consistent
#   * the Reaper timeouts are the decided 5 minutes, not the e2e tests' 20s
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  kafka:
    restart: unless-stopped
  mongo:
    restart: unless-stopped

  # mockchain (e2e/mockchain, a small Node.js JSON-RPC node) stands in for Anvil: the services only need native transfers,
  # the MockERC20, blocks, receipts and logs. Anvil's --state file is rewritten in place, and a kill mid-dump left it
  # truncated (the container crash-looped for days); mockchain appends each block to a journal and cuts a partial last
  # line on start. The service keeps the name `anvil` and port 8545, so no other service changes.
  anvil:
    restart: unless-stopped
    image: digiwal-mockchain:dev
    build:
      context: ..
      dockerfile: e2e/mockchain/Dockerfile
    entrypoint: ["node", "server.js"]
    user: root # the volume is root-owned
    environment:
      BLOCK_TIME_MS: "2000" # the sweeper, chain-watcher and withdrawals only advance with blocks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8545/"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 2g # Node's heap is capped at 1.5 GB; the chain keeps its blocks, receipts and logs in memory (heap_mb on GET /)
    volumes:
      - anvil_data:/data
    logging: &rotate
      driver: json-file
      options: {max-size: 50m, max-file: "3"}

  wallet-service:
    restart: unless-stopped
  ledger-service:
    restart: unless-stopped
  chain-watcher:
    restart: unless-stopped
  sweeper:
    restart: unless-stopped
  history-service:
    restart: unless-stopped
  api-gateway:
    restart: unless-stopped

  withdrawal-service:
    restart: unless-stopped
    environment:
      STUCK_REQUEST_TIMEOUT: 5m
      STUCK_RESERVATION_TIMEOUT: 5m
      REAPER_INTERVAL: 30s

  simulator:
    logging: *rotate
    build:
      context: .
      dockerfile: cmd/sim/Dockerfile
    restart: unless-stopped
    user: "10014:10014" # presents the sweeper's leaf (key 0400, owner 10014): it must run as that uid
    command: ["run", "--users", "${SIM_USERS:-25}", "--rate", "${SIM_RATE:-12}", "--workers", "${SIM_WORKERS:-16}"]
    environment:
      SIM_RPC_URL: http://anvil:8545
      SIM_GATEWAY_URL: http://api-gateway:8080
      SIM_WALLET_TLS_URL: https://wallet-service:8443
      SIM_PKI_DIR: /certs # the sweeper's leaf cert: the only one wallet-service admits on hot-address
      SIM_STATE_FILE: /data/state.json
    volumes:
      - ../infra/pki/out/sweeper:/certs:ro
      - sim_data:/data
    # The simulator retries until the stack answers, so it only needs the others started.
    depends_on:
      anvil: {condition: service_healthy}
      api-gateway: {condition: service_started}
      wallet-service: {condition: service_started}
      withdrawal-service: {condition: service_started}
      sweeper: {condition: service_started}
      chain-watcher: {condition: service_started}

  # --- the auditor (dev only) and the Measurement Plane exporters (docs/design/multi-node-deployment.md, M4). Not part of
  # the product stack: `make up` starts them last, and only on the node whose overlay enables them.
  auditor:
    build:
      context: ..
      dockerfile: services/auditor/Dockerfile
    restart: unless-stopped
    logging: *rotate
    environment:
      PORT: "8080"
      AUDITOR_ENV: dev
      AUDITOR_ALLOWED_CHAIN_IDS: "31337"
      RPC_URL: http://anvil:8545
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      TLS_CA_FILE: /certs/ca-cert.pem
      AUDIT_WALLET_URL: https://wallet-service:8443
      RECON_CAPITAL: ${RECON_CAPITAL:-}
      RECON_TOLERANCE: ${RECON_TOLERANCE:-}
    volumes:
      - ../infra/pki/out/auditor:/certs:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host # the host's own CPU, memory, disk and network; bound to the private address by the overlay
    pid: host
    volumes: ["/:/host:ro,rslave"]
    logging: *rotate

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command: [--housekeeping_interval=10s, --docker_only=true, --store_container_labels=false,
      "--whitelisted_container_labels=com.docker.compose.service"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices: ["/dev/kmsg"]
    logging: *rotate

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_PASSWORD:-}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    logging: *rotate

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ../infra/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *rotate

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: [--kafka.server=kafka:9092] # consumer lag per group: no service exports it
    depends_on:
      kafka: {condition: service_healthy}
    logging: *rotate

volumes:
  alertmanager_data:
  anvil_data:
  sim_data:
