# Layer-4 balancer in front of the ledger-services (dev/nodes/vm3.yml, service ledger-lb). It must NOT terminate TLS: the ledger-service authorises callers by
# the CN of the client certificate (mTLS), so the handshake has to reach it untouched. The gateways keep calling https://ledger-service:8443, which is this
# container's network alias; the certificate they verify is the ledger-service's own.
global
    maxconn 50000
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    timeout connect 3s
    timeout client  60s
    timeout server  60s
    option clitcpka
    option srvtcpka

frontend ledger
    bind :8443
    default_backend ledgers

backend ledgers
    balance leastconn
    default-server check inter 2s fall 3 rise 2
    server ledger1 10.10.0.3:8444   # vm4: the instance with the deposit consumer
    server ledger2 10.10.0.3:8448   # vm4: serves calls only

frontend ops
    mode http
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
