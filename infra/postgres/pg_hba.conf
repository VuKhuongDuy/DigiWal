# pg_hba.conf for the per-node Postgres servers (docs/design/multi-node-deployment.md, invariant 5).
# Order matters: first match wins.
#  - the superuser (`custody`, password in the node's .env) is reachable only from inside the container
#    (docker exec) — never over TCP;
#  - each service has its own role, scram-sha-256, and may only open its own database, from the Docker bridge
#    networks (same-node services) or the WireGuard network (the peer node, tools reaching it over ssh tunnels).
local   all             all                                     trust
host    all             custody         0.0.0.0/0               reject
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.10.0.0/24            scram-sha-256
host    all             all             0.0.0.0/0               reject
host    all             all             ::0/0                   reject
